<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repositorios - Claudinosasa2</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#050816,#0d1024,#170d2e);
color:white;
overflow-x:hidden;

}

body::before{

content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top,#00ffe522,transparent 40%),
radial-gradient(circle at bottom,#8f00ff22,transparent 45%);
z-index:-1;

}

header{

text-align:center;
padding:40px;

}

header img{

width:150px;
height:150px;
border-radius:50%;
border:4px solid cyan;
box-shadow:0 0 25px cyan;

}

h1{

margin-top:20px;
font-family:Orbitron;
font-size:45px;
color:#00fff2;
text-shadow:0 0 15px cyan;

}

p{

opacity:.8;
margin-top:10px;

}

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
padding:40px;

}

.card{

background:#10182bcc;
border:2px solid #00ffee55;
border-radius:20px;
overflow:hidden;
transition:.4s;
box-shadow:0 0 15px #000;

}

.card:hover{

transform:translateY(-10px) scale(1.03);
box-shadow:0 0 25px cyan;

}

.card img{

width:100%;
height:190px;
object-fit:cover;

}

.info{

padding:20px;

}

.info h2{

font-family:Orbitron;
margin-bottom:10px;
color:#00ffe7;

}

.info p{

min-height:70px;

}

button{

margin-top:15px;
padding:12px 25px;
border:none;
border-radius:50px;
cursor:pointer;
background:linear-gradient(90deg,#00ffee,#8f00ff);
color:white;
font-weight:bold;
font-size:15px;
transition:.3s;

}

button:hover{

transform:scale(1.08);

}

footer{

padding:30px;
text-align:center;
opacity:.7;

}

</style>

</head>

<body>

<header>

<img src="claudinosasa2.jfif">

<h1>CLAUDINOSASA2</h1>

<p>Mis proyectos en GitHub</p>

</header>

<div class="grid" id="repos"></div>

<footer>

Desarrollado con HTML • CSS • JavaScript 🚀

</footer>

<script>

const imagenes=[
"grafica.jfif",
"index.jfif",
"py.jfif",
"boostrap.jfif"
];

fetch("https://api.github.com/users/claudinosasa2/repos?sort=updated")
.then(res=>res.json())
.then(data=>{

const contenedor=document.getElementById("repos");

data.forEach((repo,i)=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<img src="${imagenes[i%imagenes.length]}">

<div class="info">

<h2>${repo.name}</h2>

<p>${repo.description || "Proyecto desarrollado por Claudinosasa2."}</p>

<p>⭐ ${repo.stargazers_count} | 🍴 ${repo.forks_count}</p>

<a href="${repo.html_url}" target="_blank">

<button>Ver repositorio</button>

</a>

</div>

`;

contenedor.appendChild(card);

});

});

</script>

</body>
</html>
